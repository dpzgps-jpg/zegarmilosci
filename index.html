<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador Regresivo - San Valentín</title>
    <!-- Fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- Archivo CSS -->
    <link rel="stylesheet" href="nword.css">
</head>
<body>

    <!-- Fondo decorativo con imágenes de corazones y nubes -->
    <img src="corazon1.png" class="heart h1" alt="Corazón decorativo">
    <img src="corazon2.png" class="heart h2" alt="Corazón decorativo">
    <img src="corazon3.png" class="heart h3" alt="Corazón decorativo">
    
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>

    <div class="container">
        <!-- Título superior -->
        <h2 class="title-top">Brakuje</h2>

        <!-- Rejilla de contadores principal -->
        <div class="countdown-grid">
            <div class="card">
                <div class="card-number" id="days">00</div>
                <div class="card-label">Dni</div>
            </div>

            <div class="card">
                <div class="card-number" id="hours">00</div>
                <div class="card-label">Godzin</div>
            </div>

            <div class="card">
                <div class="card-number" id="minutes">00</div>
                <div class="card-label">Minut</div>
            </div>

            <div class="card">
                <div class="card-number" id="seconds">00</div>
                <div class="card-label">Sekund</div>
            </div>
        </div>

        <!-- Título inferior -->
        <div class="title-bottom">
            <span></span>
            <h1 class="target-name">żeby się zobaczyć!</h1>
        </div>
    </div>

    <!-- Archivo JS -->
    <script src="mpalabra.js"></script>
</body>
</html>
